[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-pipeline-databricks"
version = "0.1.0"
description = "Pipeline de vendas multi-fonte (Bronze/Silver/Gold) com qualidade e observabilidade"
requires-python = ">=3.10"
# pyspark/delta NÃO entram nas dependências base: o Databricks já fornece os dois
# (instalar outra versão por cima é receita para conflito de runtime).
dependencies = []

[project.optional-dependencies]
local = ["pyspark==3.5.3", "delta-spark==3.2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["delta: exige os jars do Delta Lake (baixados do Maven na primeira execução)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
