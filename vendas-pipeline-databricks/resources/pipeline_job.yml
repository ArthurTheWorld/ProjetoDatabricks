resources:
  jobs:
    pipeline_vendas:
      name: "[${bundle.target}] Pipeline de Vendas"

      # Sem `job_cluster_key`/`new_cluster`: as tasks rodam em compute SERVERLESS.
      # Motivos: nenhum tipo de nó para escolher (o YAML não depende de nuvem), sem custo de
      # cluster ocioso e é o único compute disponível no Databricks Free Edition.
      # Para cluster clássico, adicione `job_clusters` e `job_cluster_key` por task.

      # Cada task recebe run_id: "{{job.run_id}}" (referência dinâmica do Databricks): o mesmo
      # id em todas as tasks, e um "repair run" o preserva (reexecuta só o que falhou).

      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../notebooks/01_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"

        - task_key: silver
          depends_on: [{task_key: ingest_bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver_normalize.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"

        - task_key: gate_silver
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/03_quality_gate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"
              tabela_logica: silver_vendas
              tabela_origem: silver_vendas

        - task_key: gold_build
          depends_on: [{task_key: gate_silver}]     # Gold só constrói sobre Silver aprovada
          notebook_task:
            notebook_path: ../notebooks/04_gold_build.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"

        - task_key: gate_gold
          depends_on: [{task_key: gold_build}]
          notebook_task:
            notebook_path: ../notebooks/03_quality_gate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"
              tabela_logica: gold_vendas_diarias
              tabela_origem: gold_vendas_diarias_staging

        - task_key: gold_publish
          depends_on: [{task_key: gate_gold}]
          notebook_task:
            notebook_path: ../notebooks/05_gold_publish.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              run_id: "{{job.run_id}}"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      email_notifications:
        on_failure:
          - ${var.alert_email}

      # Evita duas execuções simultâneas escrevendo nas mesmas tabelas.
      max_concurrent_runs: 1
